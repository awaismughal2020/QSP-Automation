# Management Accounts Line Item Mappings
# Maps row labels in Management Cijfers sheet to BDO account codes
# 
# Format:
#   row_label:
#     accounts: ["code1", "code2", "code*"]  # Use * for wildcard
#     calc_type: "sum" or "direct"
#
# Dutch Chart of Accounts Reference:
#   10xxxxx, 11xxxxx = Equity (Eigen Vermogen / EV)
#   16xxxxx = Real Estate (Vastgoed / VG)
#   17xxxxx = Financial Fixed Assets (FVA)
#   19xxxxx = Long-term Liabilities / Loans (LLS)
#   20xxxxx = Receivables (Vorderingen / VOR)
#   23xxxxx = Current Liabilities (Kruisposten / LM)
#   24xxxxx = Bank Accounts (LM)
#   25xxxxx = Tax/Service costs (Belasting / BEL)
#   26xxxxx, 27xxxxx = Accruals (RC, KLS)
#   40-47xxxxx = Expenses (KN, FINBL, AFKN)
#   80-84xxxxx = Income (OPB - Opbrengsten)
#   95xxxxx = Tax/Result (VPB)

