# BDO Account Code Mappings
# Maps Dutch account codes to standardized internal names
# Handles historical naming variations

account_codes:
  # ASSETS - Real Estate
  property_acquisition:
    codes: ["1600000"]
    name_patterns: ["Verkrijgingsprijs", "Acquisition cost"]
    category: "assets"
    subcategory: "real_estate"
    
  cumulative_depreciation:
    codes: ["1600200"]
    name_patterns: ["Cumulatieve afschrijving", "Cumulative depreciation"]
    category: "assets"
    subcategory: "real_estate"
    sign: "negative"
    
  disposals_cost:
    codes: ["1601000", "1610803"]  # Code changed over time
    name_patterns: ["Verkoop verkrijgingsprijs", "Disposal acquisition"]
    category: "assets"
    subcategory: "real_estate"
    
  disposals_depreciation:
    codes: ["1611003"]
    name_patterns: ["Verkoop afschrijving", "Disposal depreciation"]
    category: "assets"
    subcategory: "real_estate"

  # ASSETS - Financial
