  provisions:
    codes: ["3000*", "3100*"]
    name_patterns: ["Voorziening", "Provision", "Reserve"]
    category: "liabilities"
    subcategory: "provisions"

# Schema drift handling rules
schema_handling:
  # How to detect data start row
  data_start_detection:
    - look_for_numeric_account_code: true
    - skip_header_rows: 4
    - fallback_row: 5

  # Column detection by header patterns
  column_patterns:
    account_code: ["Grootboek", "Account", "Code", "Nr"]
    account_name: ["Omschrijving", "Description", "Naam"]
    opening_balance: ["Beginsaldo", "Opening", "Start"]
    mutations: ["Mutatie", "Movement", "Change"]
    closing_balance: ["Eindsaldo", "Closing", "End", "Saldo"]
    period_indicator: ["Periode", "Period", "Q[1-4]"]

  # Fallback to position-based if pattern matching fails
  position_fallback:
    account_code_col: 0
    account_name_col: 1
    balance_cols_start: 2

