    type: bdo_sum_range
    start_account: "2502020"
    end_account: "2502024"
    count: 6
    additional: ["2742000", "2741000", "2741001"]
    
  8:
    label: "Prepaid expenses"
    type: bdo_sum_range
    start_account: "2040200"
    end_account: "2040900"
    count: 3
    additional: ["2300001", "2040601"]
    
  9:
    label: "Cash"
    type: bdo_sum_range
    start_account: "2400200"
    end_account: "2400206"
    count: 7
    
  10:
    label: "Equity"
    type: bdo_sum_range
    start_account: "1000002"
    end_account: "1160000"
    count: 3
    
  11:
    label: "AC Shareholder"
    type: bdo_ref
    account_codes: ["2000100"]
    sign: ""
    operator: "+"
    
  12:
    label: "Bank loan"
    type: bdo_ref
    account_codes: ["1930001", "1930101"]
    sign: ""
    operator: "+"
    
  13:
    label: "Amortised fee"
    type: bdo_sum_range
    start_account: "1930200"
    count: 1
    
  14:
    label: "Accounts payable"
    type: bdo_ref
    account_codes: ["2730000", "2740500", "2741004", "2741200", "2300000"]
    sign: ""
    operator: "+"
    
  15:
    label: "Current account"
    type: bdo_sum_range
    start_account: "2730001"
    end_account: "2650001"
    count: 6
    
  16:
    label: "VAT payable"
    type: bdo_ref
    account_codes: ["2512100"]
    sign: ""
    operator: "+"
    
  17:
    label: "Deposits"
    type: bdo_ref
    account_codes: ["2740300"]
