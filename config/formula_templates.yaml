# Formula Templates for Management Cijfers
#
# This file maps Management Cijfers row numbers to their formula definitions.
# 
# Formula types:
# 1. bdo_ref: References BDO sheet cells by account code
#    - account_codes: List of account codes to look up in BDO sheet
#    - sign: Sign prefix (- for negation, + for positive, or empty)
#    - operator: How to combine multiple accounts (+ for addition, - for subtraction)
#
# 2. bdo_sum_range: SUM of a range of BDO rows (for rows with multiple accounts)
#    - start_account: First account code in range
#    - end_account: Last account code in range
#    - additional: Optional additional account codes to add
#
# 3. calc: Internal calculation formula (SUM, etc.)
#    - pattern: Formula pattern with {COL} placeholder for current column
#
# 4. constant: Fixed value (e.g., 0)
#    - value: The constant value
#
# When generating a new quarterly column:
# - For bdo_ref formulas: Look up each account code's row in the new BDO sheet,
#   build the formula with correct row numbers
# - For calc formulas: Replace {COL} with the actual column letter

# Balance Sheet Section (rows 3-19)
# NOTE: Balance Sheet formulas only exist in the LTM column (column H references)
balance_sheet:
