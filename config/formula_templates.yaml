    label: "Deferred Tax Asset"
    type: bdo_ref
    account_codes: ["1790002"]
    sign: ""
    operator: "+"
    
  4:
    label: "Real estate"
    type: bdo_sum_range
    start_account: "1600000"
    end_account: "1610803"
    count: 5
    
  5:
    label: "Financial fixed assets"
    type: bdo_ref
    account_codes: ["1760000", "1760300", "1790000"]
    sign: ""
    operator: "+"
    
  6:
    label: "Accounts receivable"
    type: bdo_ref
    account_codes: ["2000000", "2000300", "2040100"]
    sign: ""
    operator: "+"
    
  7:
