# Accounting rules for Management Accounts generation and verification.
#
# These rules drive reconciliation, rounding, protected rows, bank-account
# mapping, and template layout — keeping magic numbers out of Python code.
# Update this file when the Excel template structure changes.

# ─── Identity alignment ───
identity_alignment:
  authoritative_row: 19       # BS total (Total Equity Movement)
  dependent_row: 68            # PL total (Direct Result)
  scope: ltm_only              # ltm_only | quarter_and_ltm
  max_snap_units: 2            # snap PL68 to BS19 when diff <= this
  # MUST be false. When true, _enforce_identity_formula() rewrites row 68 LTM
  # to ={COL}19, turning the BS-vs-PL cross-check into a tautology. The
  # authoritative writer is _enforce_bdo_alignment() which sets row 19 from
  # the LTM override (SUM(3:18) - H_verschil) and row 68 from =66+67 so that
  # both totals derive independently and can be reconciled against BDO.
  enforce_in_workbook: false
  # These rows must contain FORMULAS whose result matches BDO ground truth.
  formula_total_rows: [19, 68]

# ─── Interest section configuration ───
# All BDO rows are discovered dynamically from these account codes.
interest_section:
  management_row: 60          # MA row for consolidated interest
  absorbed_rows: [61, 64]     # Interest sub-rows; LTM uses horizontal SUMs (not consolidated into 60)
  dmrrp_row: 65               # MA row for DMRRP income
  account_codes:              # LTM row 60: consolidated BDO column H (discovered rows)
    - "4601000"
    - "4611000"
    - "4613000"
    - "4620200"
    - "4623001"
    - "4643000"
    - "4642000"
  dmrrp_code: "4663000"
  cit_codes:
    - "9500000"
    - "9510000"

# ─── Rounding ───
rounding:
  round_to_integer: true
  decimal_rows: [26]           # rows exempt from integer rounding (percentages)

# ─── Bank-account overview section in Management Cijfers ───
# Keys = MA row numbers, values = BDO account codes (resolved at runtime).
bank_bdo_row_map:
  107: 35    # ABN AMRO RENT
  108: 34    # ABN AMRO MAINT
  109: 36    # ABN AMRO EXP
  110: 33    # ABN AMRO DEP   (was 32 — corrected to match client reference)
  111: 32    # ABN AMRO GEN   (was 33 — corrected to match client reference)
  112: 37    # ABN AMRO CAPEX
  113: 31    # ABN AMRO DISPOSAL
bank_total_row: 114            # SUM of the bank rows above

# ─── Protected rows ───
# Values must not be overwritten by AI patches (formula patches OK).
protected_total_rows: [19, 68]

# ─── Template layout (row ranges in Management Cijfers) ───
layout:
  balance_sheet_rows: [3, 19]          # inclusive start-end for BS data
  profit_loss_rows: [23, 68]           # inclusive start-end for P&L data
  bank_rows: [107, 114]               # inclusive start-end for bank overview
  bank_section_rows: [104, 120]        # wider range including headers
  header_row: 22                       # P&L section header row
  date_row: 2                          # BS date row
  bs_total_row: 19                     # Total Equity Movement
  bs_border_row: 18                    # row that gets a bottom border
  pl_total_row: 68                     # Direct Result
  cash_proceeds_row: 50                # Cash proceeds sale
  warning_start_row: 70                # where validation warnings are written
  other_costs_row: 40                  # Catch-all row for unreferenced P&L items

  # Bold/total rows in P&L
  bold_total_rows: [19, 25, 30, 44, 45, 48, 55, 57, 66, 68]

  # Calc formula definitions (row -> formula template using {col} placeholder)
  calc_formulas:
    19: "={col}68"
    25: "=SUM({col}23:{col}24)"
    26: "={col}25/{col}23-1"
    30: "=SUM({col}27:{col}29)"
    44: "=SUM({col}32:{col}43)"
    45: "={col}25+{col}30+{col}44"
    48: "={col}47+{col}46+{col}45"
    51: "=-({col}50-{col}53)"
    55: "={col}53+{col}48"
    57: "={col}56+{col}55"
    66: "=SUM({col}57:{col}65)"
    68: "={col}66+{col}67"

  # LTM-only calc formula overrides (overrides calc_formulas for LTM column only)
  # Placeholders:
  #   {col}            → LTM column letter (e.g. AD)
  #   {bdo}            → current BDO sheet name (no quotes; include single quotes in pattern)
  #   {verschil_row}   → row number in the BDO sheet whose column A label is
  #                      "Verschil balans en winst-en-verlies" (resolved at
  #                      runtime by _find_verschil_row()). The position of this
  #                      row varies between BDO files, so it MUST never be
  #                      hardcoded — earlier versions baked in H134, which is
  #                      "Afschrijving prepaid" in some quarterly BDO sheets.
  ltm_calc_overrides:
    # Row 19 = Total Equity Movement. The closing-balance section (rows 3-18)
    # plus a small reconciliation term '<BDO>'!H{verschil_row}
    # ("Verschil balans en winst-en-verlies") which the client reference
    # workbook subtracts. Without this term the totals diverge from BDO's
    # Resultaat na belasting by the amount of that reconciliation row.
    19: "=SUM({col}3:{col}18)-'{bdo}'!H{verschil_row}"

  # Intermediate P&L rows (net interest, derivatives, etc.)
  intermediate_rows: [60, 61, 64, 65, 67]

  # Deprecated — LTM rows 61/64 now use the last 4 quarter columns dynamically.
  # Kept for backward compatibility only; not read by interest override logic.
  interest_quarter_horizontal_sum_start_column: 25

# ─── Styling ───
styling:
  ltm_background_color: "FFDDEAF6"    # light blue aRGB for data rows
  header_background_color: "FF5B9BD5"  # medium blue aRGB for header rows (2, 22)
  text_color_on_blue: "FF000000"       # black text on light blue
  text_color_header: "FFFFFFFF"        # white text on header blue
  error_font_color: "FFFF0000"         # red for validation warnings
  bank_text_color: "FF00B050"          # green text for bank account data rows
  error_fill_color: "FFFFCCCC"         # light red fill for warnings
  number_format: '_(* #,##0_);_(* \(#,##0\);_(* "-"??_);_(@_)'
  # Canonical font for the LTM column's BS section (rows 2–20). The client
  # reference workbook uses Avenir Book 10. The deterministic styling
  # safety net in `_update_summary_sheet` falls back to these values when
  # `insert_cols` leaves a cell with default Calibri / no font.
  font:
    name: "Avenir Book"
    size: 10

# ─── BDO sheet structure ───
# NOTE: data_rows and special_rows are HINTS — all scanning is done dynamically.
bdo:
  data_column: 8               # column H (LTM totals / closing balance)
  quarter_columns: [4, 5, 6, 7]  # columns D-G (quarterly mutations)
  data_rows: [6, 124]          # hint: start-end for account data rows
  special_rows: [129, 136]     # hint: start-end for special summary rows
  label_scan_columns: [1, 2]   # columns to scan for row labels
